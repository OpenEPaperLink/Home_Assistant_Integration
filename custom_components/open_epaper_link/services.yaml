drawcustom:
  target:
  fields:
    payload:
      required: true
      example: >
        [{"type": "text", "value": "Hello World!", "x": 0, "y": 0, "size": 40}]
      selector:
        object:
    background:
      default: white
      selector:
        select:
          options: ["white", "black", "accent", "red", "yellow"]
    rotate:
      selector:
        number:
          min: 0
          max: 270
          step: 90
    dither:
      default: ordered
      selector:
        select:
          translation_key: dither
          options:
            - none
            - burkes
            - ordered
            - floyd_steinberg
            - atkinson
            - stucki
            - sierra
            - sierra_lite
            - jarvis_judice_ninke
            - dizzy
    refresh_type:
      default: adaptive
      selector:
        select:
          translation_key: refresh_type
          options:
            - adaptive
            - full
            - fast
            - fast_no_red
    ttl:
      default: 60
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: seconds
    dry-run:
      default: false
      selector:
        boolean:

setled:
  target:
  fields:
    mode:
      default: flash
      selector:
        select:
          options: ["off", "flash"]
    brightness:
      default: 1
      selector:
        number:
          min: 1
          max: 16
    repeats:
      default: 2
      selector:
        number:
          min: 1
          max: 256
    color1:
      default: [255, 0, 0]
      selector:
        color_rgb:
    flash_speed1:
      default: 0.2
      selector:
        number:
          min: 0
          max: 1.5
          step: 0.1
          unit_of_measurement: seconds
    flash_count1:
      default: 2
      selector:
        number:
          min: 0
          max: 15
    delay1:
      default: 0.1
      selector:
        number:
          min: 0
          max: 25.5
          step: 0.1
          unit_of_measurement: seconds
    color2:
      advanced: true
      default: [0, 255, 0]
      selector:
        color_rgb:
    flash_speed2:
      advanced: true
      default: 0.2
      selector:
        number:
          min: 0
          max: 1.5
          step: 0.1
          unit_of_measurement: seconds
    flash_count2:
      advanced: true
      default: 2
      selector:
        number:
          min: 0
          max: 15
    delay2:
      advanced: true
      default: 0.1
      selector:
        number:
          min: 0
          max: 25.5
          step: 0.1
          unit_of_measurement: seconds
    color3:
      advanced: true
      default: [0, 0, 255]
      selector:
        color_rgb:
    flash_speed3:
      advanced: true
      default: 0.2
      selector:
        number:
          min: 0
          max: 1.5
          step: 0.1
          unit_of_measurement: seconds
    flash_count3:
      advanced: true
      default: 2
      selector:
        number:
          min: 0
          max: 15
    delay3:
      advanced: true
      default: 0
      selector:
        number:
          min: 0
          max: 25.5
          step: 0.1
          unit_of_measurement: seconds

