name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The Python version comes from requires-python in pyproject.toml, which
      # tracks what Home Assistant itself supports.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check custom_components tests

      - name: Check formatting
        run: uv run ruff format --check custom_components tests

      - name: Run tests
        run: >-
          uv run pytest tests
          --cov=custom_components/open_epaper_link
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
        continue-on-error: true
