[project]
name = "open-epaper-link"
version = "0.0.0"
description = "Home Assistant integration for OpenEPaperLink"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
# The test environment. pytest-homeassistant-custom-component pins a compatible
# homeassistant, pytest and pytest-asyncio itself; pinning those separately is
# what causes the usual resolution conflicts, so it is the only pin here.
#
# Home Assistant itself is run from a separate HA core checkout with this
# integration symlinked into its custom_components, because p-h-c-c and a real
# HA install cannot share an environment.
dev = [
    "pytest-homeassistant-custom-component==0.13.375",
    "mypy==1.18.2",
    "ruff==0.16.2",
    # Runtime requirements, kept in sync with custom_components/open_epaper_link/manifest.json
    "odl-renderer==0.5.12",
    "py-atc-ble-oepl==0.7.0",
    "py-oepl[dither]==0.8.0",
    # Home Assistant's bluetooth component and its transitive usb component,
    # needed to import them in tests. Versions match what this Home Assistant
    # release pins in their manifests.
    "aiousbwatcher==1.1.2",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.0.22",
    "habluetooth==7.1.2",
    "serialx==1.11.0",
]

[tool.uv]
# A Home Assistant integration is not an installable package.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "PTH",  # use pathlib
    "RUF",
    "SIM",  # simplify
    "UP",   # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are frequently requested for their side effect rather than their
# value, which is the documented pytest pattern.
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# Home Assistant and the protocol libraries are not fully typed at the seams we
# touch; everything we write is.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
