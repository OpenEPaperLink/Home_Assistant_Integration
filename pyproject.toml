[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "tests"
]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "PTH",  # use pathlib
    "RUF",
    "SIM",  # simplify
    "UP",   # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are frequently requested for their side effect rather than their
# value, which is the documented pytest pattern.
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# Home Assistant and the protocol libraries are not fully typed at the seams we
# touch; everything we write is.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
