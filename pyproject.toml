[project]
name = "open-epaper-link"
version = "0.0.0"
description = "Home Assistant integration for OpenEPaperLink"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
# The test environment. pytest-homeassistant comes with Home Assistant, shares its
# version, and pins a compatible pytest and pytest-asyncio itself; pinning those
# separately is what causes the usual resolution conflicts. Its bluetooth extra
# brings what Home Assistant's bluetooth and usb components need to be imported.
#
# Home Assistant itself is run from a separate HA core checkout with this
# integration symlinked into its custom_components, because the test package and
# a real HA install cannot share an environment.
dev = [
    # No 2026.11.0 of it is on PyPI yet; see override-dependencies below.
    "pytest-homeassistant[bluetooth]==2026.11.0b6",
    # Coverage in CI; pytest-homeassistant does not bring it.
    "pytest-cov==7.1.0",
    "mypy==1.18.2",
    "ruff==0.16.2",
    # Runtime requirements, kept in sync with custom_components/open_epaper_link/manifest.json
    "odl-renderer==0.5.15",
    "py-atc-ble-oepl==0.9.0",
    "py-oepl[dither]==0.13.0",
]

[tool.uv]
# A Home Assistant integration is not an installable package.
package = false
# Test against the release, not the beta the test package pins. Drop this and bump
# the pin above once pytest-homeassistant 2026.11.0 is published.
override-dependencies = ["homeassistant==2026.11.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "PTH",  # use pathlib
    "RUF",
    "SIM",  # simplify
    "UP",   # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are frequently requested for their side effect rather than their
# value, which is the documented pytest pattern.
"tests/*" = ["ARG001"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
# Home Assistant and the protocol libraries are not fully typed at the seams we
# touch; everything we write is.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
